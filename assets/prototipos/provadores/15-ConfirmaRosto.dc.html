<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="robots" content="noindex">
<title>Confirmação pelo rosto</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
:root{--bg:#FFFFFF;--surface:#F4F4F4;--surface-2:#E8E8E8;--ink:#0A0A0A;--muted:#5C5C5C;--line-strong:#8A8A8A;--accent:#480CF8;--on-accent:#FFFFFF}
body{margin:0;font-family:"Inter",system-ui,sans-serif;color:#0A0A0A}
a{color:inherit;text-decoration:none}
h1{margin:0;font-size:var(--fs-5);line-height:var(--lh-5);font-weight:800;letter-spacing:-1px}
p{margin:0;font-size:var(--fs-2);line-height:var(--lh-2);font-weight:500}
:root{--fs-1:20px;--lh-1:28px;--fs-2:24px;--lh-2:32px;--fs-3:32px;--lh-3:40px;--fs-4:40px;--lh-4:48px;--fs-5:48px;--lh-5:56px;--fs-title-sm:28px;--lh-title-sm:34px}
.hd{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;height:88px;flex:none}
.hd>:first-child{justify-self:start}
.hd>:last-child{justify-self:end}
.hc{flex:none;font-size:20px;font-weight:700;letter-spacing:.4px}
.pb,.po{display:inline-flex;align-items:center;min-height:56px;padding:0 24px;border-radius:999px;box-sizing:border-box;font-size:var(--fs-1);font-weight:700;letter-spacing:.4px;border:2px solid #8A8A8A;background:#FFFFFF}
.po.on{background:#0A0A0A;color:#FFFFFF;border-color:#0A0A0A}
.st{display:flex;align-items:center;gap:12px;font-size:var(--fs-1);font-weight:700;letter-spacing:.4px}
.st span.b{display:flex;gap:6px}
.st i{display:block;width:28px;height:8px;border-radius:999px;background:#0A0A0A}
.st i.o{background:transparent;border:2px solid #8A8A8A;box-sizing:border-box}
.btn{white-space:nowrap;flex:none;display:inline-flex;align-items:center;justify-content:center;min-height:64px;padding:0 32px;border-radius:999px;font-size:var(--fs-2);font-weight:700;box-sizing:border-box}
.btn.p{background:#480CF8;color:#FFFFFF;font-weight:600}
.btn.s{border:2px solid #8A8A8A;background:#FFFFFF}

.mi{flex:none;display:block}
.pb{gap:8px;padding:0 24px 0 16px}
.pb.r{padding:0 16px 0 24px}
.ib{flex:none;display:inline-flex;align-items:center;justify-content:center;width:56px;height:56px;padding:0;border-radius:999px;box-sizing:border-box;border:2px solid #8A8A8A;background:#FFFFFF;color:#0A0A0A;cursor:pointer;font-family:inherit}
.ib.k{background:#0A0A0A;border-color:#0A0A0A;color:#FFFFFF}
.ib.g{background:#F4F4F4;border-color:#F4F4F4}
.ib:disabled{opacity:.35;cursor:default}
.ck{display:inline-flex;align-items:center;gap:8px}
@keyframes mispin{to{transform:rotate(360deg)}}
.spin{animation:mispin 1.2s linear infinite}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
/* estados de interação: foco visível (accent) e pressionado */
a:focus-visible,button:focus-visible{outline:3px solid #480CF8;outline-offset:2px}
a,button{transition:transform .12s ease}
a:active,button:not(.sc):not(:disabled):active{transform:scale(.98)}
.btn.p:active,a[style*="background:#480CF8"]:active,a[style*="background: #480CF8"]:active,button[style*="background:#480CF8"]:active,button[style*="background: #480CF8"]:active{background:#3A08C6!important}
@media (prefers-reduced-motion:reduce){a,button{transition:none}a:active,button:active{transform:none}}
</style>
</helmet>
<div style="width:1280px;height:800px;box-sizing:border-box;background:#FFFFFF;display:flex;flex-direction:column;padding:0 40px 32px;overflow:hidden">
  <div class="hd"><span class="hc">C&amp;A · CABINE 4</span><div class="st"><span class="b"><i></i><i></i><i></i></span><span>ETAPA 3 · RECEBER E PAGAR</span></div><span></span></div>
  <div style="flex:1;display:flex;gap:48px;align-items:center">
    <div style="flex:none;width:560px;height:620px;border-radius:28px;overflow:hidden;position:relative;background:radial-gradient(circle at 50% 42%,#7A7A7A 0%,#3A3A3A 70%,#242424 100%);opacity:{{ camEO }};transform:scale({{ camES }});transition:{{ camET }}" role="img" aria-label="Simulação da câmera: rosto centralizado dentro do contorno oval, sendo confirmado">
      <img src="blob/3951f40b18fa29d27c5dca6fe84a4e84.webp" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 20%;display:block">
      <svg width="560" height="620" viewBox="0 0 560 620" style="position:absolute;inset:0" aria-hidden="true"><path fill-rule="evenodd" d="M0 0H560V620H0Z M110 294a170 225 0 1 0 340 0a170 225 0 1 0 -340 0Z" fill="rgba(10,10,10,.62)"></path><ellipse cx="280" cy="294" rx="170" ry="225" fill="none" stroke="#FFFFFF" stroke-width="6" style="stroke-width:{{ ringW }}px;transition:stroke-width .4s ease"></ellipse></svg>
      <span style="position:absolute;z-index:1;left:50%;transform:translateX(-50%);bottom:24px;display:inline-flex;align-items:center;gap:12px;min-height:56px;padding:0 28px;border-radius:999px;background:#FFFFFF;box-sizing:border-box;font-size:var(--fs-1);font-weight:700;letter-spacing:.4px;white-space:nowrap;opacity:{{ readO }};transition:opacity .3s ease"><svg class="mi spin" width="24" height="24" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" focusable="false"><path d="M12 6v3l4-4-4-4v3c-4.42 0-8 3.58-8 8 0 1.57.46 3.03 1.24 4.26L6.7 14.8A5.87 5.87 0 0 1 6 12c0-3.31 2.69-6 6-6zm6.76 1.74L17.3 9.2c.44.84.7 1.79.7 2.8 0 3.31-2.69 6-6 6v-3l-4 4 4 4v-3c4.42 0 8-3.58 8-8 0-1.57-.46-3.03-1.24-4.26z"/></svg>CONFIRMANDO SEU ROSTO…</span>
      <span style="position:absolute;z-index:1;left:50%;transform:translateX(-50%);bottom:24px;display:inline-flex;align-items:center;gap:12px;min-height:56px;padding:0 28px 0 20px;border-radius:999px;background:#0A0A0A;color:#FFFFFF;box-sizing:border-box;font-size:var(--fs-1);font-weight:700;letter-spacing:.4px;white-space:nowrap;opacity:{{ doneO }};transition:opacity .3s ease"><svg class="mi" width="24" height="24" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" focusable="false"><path d="M9 16.17 4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41L9 16.17z"/></svg>ROSTO CONFIRMADO</span>
    </div>
    <div style="flex:1;min-width:0;display:grid;opacity:{{ txtO }};transform:translateY({{ txtY }});transition:{{ txtT }}">
      <div style="grid-area:1/1;display:flex;flex-direction:column;gap:24px;opacity:{{ rdO }};visibility:{{ rdV }};transition:{{ rdT }}">
        <h1>Fique de frente para confirmar</h1>
        <p style="color:#5C5C5C;font-size:var(--fs-2);line-height:var(--lh-2);text-wrap:balance">R$ 300,92 em 4x de R$ 75,23 no C&amp;A Pay.</p>
        <div style="display:flex;gap:16px;margin-top:8px"><a href="14-Pagamento.dc.html" style="display: inline-flex; align-items: center; min-height: 64px; padding: 0px; font-size: var(--fs-2); font-weight: 600; text-decoration: underline 2px; text-underline-offset: 6px">Cancelar pagamento</a>
        </div>
      </div>
      <div style="grid-area:1/1;align-self:start;display:flex;flex-direction:column;gap:24px;opacity:{{ cfO }};visibility:{{ cfV }};transition:{{ cfT }}">
        <h1>Rosto confirmado</h1>
        <p style="color:#5C5C5C;font-size:var(--fs-2);line-height:var(--lh-2);text-wrap:balance">R$ 300,92 em 4x de R$ 75,23 no C&amp;A Pay.</p>
        <div style="display:flex;gap:16px;margin-top:8px"><a href="16-Confirmacao.dc.html" onClick="{{ goNext }}" tabindex="{{ cfTab }}" class="btn p">Continuar</a></div>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  // Reiniciar a jornada: o botão Concluir da 16 grava ca-reset e cada tela volta ao estado inicial.
  rsInit() {
    this._s0 = Object.assign({}, this.state || {});
    try { this._rs = localStorage.getItem('ca-reset') || ''; } catch (e) { this._rs = ''; }
    this._rsPoll = setInterval(() => this.rsCheck(), 150);
  }
  rsCheck() {
    try {
      const t = localStorage.getItem('ca-reset') || '';
      if (t && t !== this._rs) { this._rs = t; this.rsApply(); }
    } catch (e) {}
  }
  rsApply() {
    [this._t, this._te, this._timers, this._introT, this._ovT].forEach((a) => (a || []).forEach(clearTimeout));
    if (this._raf) cancelAnimationFrame(this._raf);
    this._i = false; this._intro = false; this._lastIntro = 0;
    const n = {};
    Object.keys(this.state || {}).forEach((k) => { n[k] = (this._s0 && k in this._s0) ? this._s0[k] : undefined; });
    this.setState(n);
  }
  componentDidMount() {
    this.rsInit();
    this._poll = setInterval(() => this.check(), 150);
    this.check();
  }
  componentWillUnmount() { clearInterval(this._rsPoll); clearInterval(this._poll); (this._te || []).forEach(clearTimeout); (this._t || []).forEach(clearTimeout); }
  // No canvas todas as telas ficam montadas: a tela de origem avisa por localStorage e esta escuta o aviso.
  check() {
    try {
      const v = (localStorage.getItem('ca-go') || '').split('|');
      if (v[0] === '15-ConfirmaRosto.dc.html' && Date.now() - (+v[1]) < 6000) { localStorage.removeItem('ca-go'); this.enter(); }
    } catch (e) {}
  }
  // Entrada vinda da 14: câmera e texto aparecem, o rosto é lido e confirmado. conf = rosto confirmado.
  enter() {
    (this._te || []).forEach(clearTimeout);
    this.setState({ ent: 0, conf: false });
    this._te = [setTimeout(() => this.setState({ ent: 1 }), 450), setTimeout(() => this.setState({ conf: true }), 3200)];
  }
  renderVals() {
    const go = this.state.ent !== undefined;
    const ent = this.state.ent === undefined ? 1 : this.state.ent;
    const conf = !!this.state.conf;
    const T = (d) => !go ? 'none' : ent ? 'opacity .5s ease ' + d + 's,transform .6s cubic-bezier(.22,.8,.3,1) ' + d + 's' : 'none';
    return {
      goNext: () => { try { localStorage.setItem('ca-go', '16-Confirmacao.dc.html|' + Date.now()); } catch (e) {} },
      camEO: ent ? '1' : '0', camES: ent ? '1' : '0.94', camET: T(0),
      txtO: ent ? '1' : '0', txtY: ent ? '0px' : '24px', txtT: T(0.2),
      readO: conf ? '0' : '1', doneO: conf ? '1' : '0', ringW: conf ? '10' : '6',
      rdO: conf ? '0' : '1', rdV: conf ? 'hidden' : 'visible', rdT: conf ? 'opacity .25s ease,visibility 0s linear .25s' : 'opacity .3s ease,visibility 0s',
      cfO: conf ? '1' : '0', cfV: conf ? 'visible' : 'hidden', cfT: conf ? 'opacity .4s ease .15s,visibility 0s' : 'opacity .2s ease,visibility 0s linear .2s',
      cfTab: conf ? '0' : '-1'
    };
  }
}
</script>
</body>
</html>
