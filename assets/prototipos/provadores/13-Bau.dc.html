<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  // Reiniciar a jornada: o botão Concluir da 16 grava ca-reset e cada tela volta ao estado inicial.
  rsInit() {
    this._s0 = Object.assign({}, this.state || {});
    try { this._rs = localStorage.getItem('ca-reset') || ''; } catch (e) { this._rs = ''; }
    this._rsPoll = setInterval(() => this.rsCheck(), 150);
  }
  rsCheck() {
    try {
      const t = localStorage.getItem('ca-reset') || '';
      if (t && t !== this._rs) { this._rs = t; this.rsApply(); }
    } catch (e) {}
  }
  rsApply() {
    [this._t, this._te, this._timers, this._introT, this._ovT].forEach((a) => (a || []).forEach(clearTimeout));
    if (this._raf) cancelAnimationFrame(this._raf);
    this._i = false; this._intro = false; this._lastIntro = 0;
    const n = {};
    Object.keys(this.state || {}).forEach((k) => { n[k] = (this._s0 && k in this._s0) ? this._s0[k] : undefined; });
    this.setState(n);
  }
  componentDidMount() {
    this.rsInit();
    this._poll = setInterval(() => this.check(), 150);
    this.check();
  }
  componentWillUnmount() { clearInterval(this._rsPoll); clearInterval(this._poll); (this._te || []).forEach(clearTimeout); }
  // No canvas todas as telas ficam montadas: a tela de origem avisa por localStorage e esta escuta o aviso.
  check() {
    try {
      const v = (localStorage.getItem('ca-go') || '').split('|');
      if (v[0] === '13-Bau.dc.html' && Date.now() - (+v[1]) < 6000) { localStorage.removeItem('ca-go'); this.enter(); }
    } catch (e) {}
  }
  // Entrada vinda da 10b: o fundo escurece, a janela sobe e o vídeo começa do início.
  enter() {
    (this._te || []).forEach(clearTimeout);
    this.setState({ ent: 0 });
    this._te = [setTimeout(() => {
      this.setState({ ent: 1 });
      try { const v = document.getElementById('bau-video'); if (v) { v.currentTime = 0; const p = v.play(); if (p && p.catch) p.catch(() => {}); } } catch (e) {}
    }, 450)];
  }
  renderVals() {
    const go = this.state.ent !== undefined;
    const ent = this.state.ent === undefined ? 1 : this.state.ent;
    return {
      goNext: () => { try { localStorage.setItem('ca-go', '14-Pagamento.dc.html|' + Date.now()); } catch (e) {} },
      scrimO: ent ? '1' : '0',
      scrimT: !go ? 'none' : ent ? 'opacity .35s ease' : 'none',
      dlgO: ent ? '1' : '0',
      dlgY: ent ? '0px' : '40px',
      dlgS: ent ? '1' : '0.97',
      dlgT: !go ? 'none' : ent ? 'opacity .35s ease,transform .5s cubic-bezier(.22,.8,.3,1)' : 'none'
    };
  }
}
</script>
